<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Knot Co | Grand Launch</title>
    
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #1a1a2e 0%, #050505 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: #D4AF37;
        }

        /* ================= MAIN SCREEN ================= */
        #main-screen {
            text-align: center;
            z-index: 10;
            transition: opacity 1s ease, transform 1s ease;
        }

        #main-screen.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        .logo {
            width: 220px;
            height: auto;
            margin-bottom: 50px;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3));
            animation: elegantFadeIn 1.5s ease-out forwards;
        }

        @keyframes elegantFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Professional Launch Button */
        .launch-btn {
            padding: 18px 55px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #D4AF37;
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.6);
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
        }

        .launch-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #D4AF37;
            transition: left 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: -1;
        }

        .launch-btn:hover {
            color: #050505;
            border-color: #D4AF37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        .launch-btn:hover::before {
            left: 0;
        }

        /* ================= OVERLAY & COUNTDOWN ================= */
        #overlay-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        #overlay-screen.active {
            opacity: 1;
        }

        .countdown-number {
            font-family: 'Playfair Display', serif;
            font-size: 10rem;
            font-weight: 700;
            color: transparent;
            background: linear-gradient(to bottom, #F9E79F, #D4AF37, #B8860B);
            -webkit-background-clip: text;
            background-clip: text;
            opacity: 0;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
        }

        @keyframes elegantCount {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); filter: blur(10px); }
            30% { opacity: 1; transform: scale(1.05) translateY(0); filter: blur(0px); }
            80% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(1.1) translateY(-20px); filter: blur(5px); }
        }

        .count-anim {
            animation: elegantCount 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Elegant Flash Transition */
        .flash-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
        }

        .flash-active {
            animation: elegantFlash 0.8s ease-out forwards;
        }

        @keyframes elegantFlash {
            0% { opacity: 0; }
            40% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ================= ELEGANT CELEBRATION ELEMENTS ================= */
        
        /* Professional Balloons (Gold, Rose Gold, Black, White) */
        .balloon {
            position: fixed;
            width: 50px;
            height: 65px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            bottom: -100px;
            z-index: 50;
            animation: balloonRise linear forwards;
            pointer-events: none;
            box-shadow: inset -8px -8px 20px rgba(0, 0, 0, 0.3), 
                        inset 8px 8px 20px rgba(255, 255, 255, 0.2),
                        0 0 20px rgba(212, 175, 55, 0.2);
        }

        /* Balloon shine highlight */
        .balloon::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 20%;
            width: 15px;
            height: 20px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            filter: blur(3px);
        }

        /* Balloon string */
        .balloon::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 1.5px;
            height: 50px;
            background: linear-gradient(to bottom, rgba(212, 175, 55, 0.6), rgba(212, 175, 55, 0.2));
        }

        @keyframes balloonRise {
            0% { 
                transform: translateY(0) rotate(0deg) translateX(0); 
                opacity: 1; 
            }
            25% { 
                transform: translateY(-30vh) rotate(5deg) translateX(10px); 
            }
            50% { 
                transform: translateY(-60vh) rotate(-5deg) translateX(-10px); 
            }
            75% { 
                transform: translateY(-90vh) rotate(3deg) translateX(5px); 
            }
            100% { 
                transform: translateY(-120vh) rotate(-3deg) translateX(0); 
                opacity: 0.8; 
            }
        }

        /* Gold Confetti */
        .confetti {
            position: fixed;
            width: 8px;
            height: 14px;
            top: -20px;
            z-index: 50;
            animation: elegantFall linear forwards;
            pointer-events: none;
        }

        @keyframes elegantFall {
            0% { transform: translateY(0) rotateZ(0deg) rotateX(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotateZ(360deg) rotateX(720deg); opacity: 0; }
        }

        /* Soft Light Flares */
        .light-flare {
            position: fixed;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #F9E79F;
            box-shadow: 0 0 10px 2px rgba(212, 175, 55, 0.8), 0 0 20px 5px rgba(212, 175, 55, 0.4);
            pointer-events: none;
            z-index: 45;
            animation: flareBurst 1.5s ease-out forwards;
        }

        @keyframes flareBurst {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--fx), var(--fy)) scale(0); opacity: 0; }
        }

        /* Ambient Background Particles */
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            animation: floatUp linear infinite;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Ambient Background -->
    <div id="particles-container"></div>

    <!-- Main Screen -->
    <div id="main-screen">
        <img src="https://i.postimg.cc/fRLF0c74/logo1.jpg" alt="The Knot Co Logo" class="logo">
        <br>
        <button class="launch-btn" id="launchBtn">Enter Experience</button>
    </div>

    <!-- Countdown Overlay -->
    <div id="overlay-screen">
        <div id="countdown-num" class="countdown-number"></div>
    </div>

    <!-- Flash Transition -->
    <div id="flash-div" class="flash-effect"></div>

    <script>
        // ================= 1. AMBIENT BACKGROUND =================
        const particlesContainer = document.getElementById('particles-container');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 10 + 8) + 's';
            particle.style.animationDelay = (Math.random() * 5) + 's';
            particlesContainer.appendChild(particle);
        }

        // ================= 2. ELEGANT CELEBRATION FUNCTIONS =================
        
        // Professional Balloons
        function createElegantBalloon() {
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            balloon.style.left = Math.random() * 100 + '%';
            balloon.style.animationDuration = (Math.random() * 3 + 5) + 's';
            
            // Luxury balloon colors: Gold, Rose Gold, Black, White, Champagne
            const colors = [
                'radial-gradient(circle at 30% 30%, #F9E79F, #D4AF37, #B8860B)', // Gold
                'radial-gradient(circle at 30% 30%, #FADBD8, #E8B4B8, #B76E79)', // Rose Gold
                'radial-gradient(circle at 30% 30%, #2C2C2C, #1a1a1a, #000000)', // Black
                'radial-gradient(circle at 30% 30%, #FFFFFF, #F5F5F5, #E0E0E0)', // White
                'radial-gradient(circle at 30% 30%, #F5E6D3, #D4B896, #A67C52)'  // Champagne
            ];
            
            balloon.style.background = colors[Math.floor(Math.random() * colors.length)];
            balloon.style.width = (Math.random() * 20 + 45) + 'px';
            balloon.style.height = (Math.random() * 25 + 60) + 'px';
            
            document.body.appendChild(balloon);
            setTimeout(() => balloon.remove(), 8000);
        }

        // Gold Confetti
        function createGoldConfetti() {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + '%';
            c.style.animationDuration = (Math.random() * 3 + 3) + 's';
            const colors = ['#D4AF37', '#F9E79F', '#B8860B', '#FFFFFF'];
            c.style.background = colors[Math.floor(Math.random() * colors.length)];
            c.style.width = (Math.random() * 6 + 4) + 'px';
            c.style.height = (Math.random() * 10 + 8) + 'px';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 6000);
        }

        // Soft Light Flares
        function createLightFlare() {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * (window.innerHeight * 0.7);
            const container = document.createElement('div');
            container.className = 'light-flare';
            container.style.left = x + 'px';
            container.style.top = y + 'px';
            
            for (let i = 0; i < 12; i++) {
                const p = document.createElement('div');
                p.className = 'light-flare';
                p.style.left = '0px';
                p.style.top = '0px';
                const angle = (i / 12) * 360;
                const dist = Math.random() * 80 + 40;
                p.style.setProperty('--fx', Math.cos(angle * Math.PI / 180) * dist + 'px');
                p.style.setProperty('--fy', Math.sin(angle * Math.PI / 180) * dist + 'px');
                container.appendChild(p);
            }
            document.body.appendChild(container);
            setTimeout(() => container.remove(), 1500);
        }

        function triggerElegantCelebration() {
            // Elegant Balloons
            for (let i = 0; i < 20; i++) {
                setTimeout(createElegantBalloon, i * 150);
            }
            // Gold Confetti
            for (let i = 0; i < 80; i++) {
                setTimeout(createGoldConfetti, i * 50);
            }
            // Soft Light Flares
            for (let i = 0; i < 6; i++) {
                setTimeout(createLightFlare, i * 500 + 200);
            }
        }

        // ================= 3. BUTTON CLICK & SEQUENCE =================
        document.getElementById('launchBtn').addEventListener('click', function() {
            // 1. Hide main screen elegantly
            document.getElementById('main-screen').classList.add('hidden');
            
            // 2. Show overlay and start celebration
            document.getElementById('overlay-screen').classList.add('active');
            triggerElegantCelebration();

            const numEl = document.getElementById('countdown-num');

            // Cinematic 3, 2, 1 Sequence (Safe setTimeouts - No Loop Errors)
            setTimeout(() => {
                numEl.textContent = '3';
                numEl.classList.remove('count-anim');
                void numEl.offsetWidth; 
                numEl.classList.add('count-anim');
            }, 600);

            setTimeout(() => {
                numEl.textContent = '2';
                numEl.classList.remove('count-anim');
                void numEl.offsetWidth;
                numEl.classList.add('count-anim');
            }, 1800);

            setTimeout(() => {
                numEl.textContent = '1';
                numEl.classList.remove('count-anim');
                void numEl.offsetWidth;
                numEl.classList.add('count-anim');
            }, 3000);

            // 4. Elegant Flash and Redirect
            setTimeout(() => {
                document.getElementById('flash-div').classList.add('flash-active');
                setTimeout(() => {
                    window.location.href = 'https://the-knotco.com/';
                }, 600);
            }, 4200);
        });
    </script>
</body>
</html>
